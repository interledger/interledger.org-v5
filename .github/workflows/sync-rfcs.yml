name: Sync RFCs
# Refreshes the RFC snapshots in src/data/docs/rfcs/ from interledger/rfcs and, if anything
# changed, opens one pull request against staging. The build never fetches RFCs (INTORG-1465):
# a GitHub outage once blocked a production publish, and upstream edits reached the site
# unreviewed. This workflow is now the only way an upstream change gets in, and a person sees
# it first.

on:
  schedule:
    # Mondays 07:00 UTC. RFCs change rarely; weekly keeps the PR noise low.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  # Two runs would force-push the same branch and could both try to create the PR. Never cancel
  # a run between the push and the PR creation: that would leave a branch with no pull request.
  group: sync-rfcs
  cancel-in-progress: false

# Deliberately empty. `permissions:` governs ONLY the automatic GITHUB_TOKEN, and this workflow
# never uses it: actions/checkout is handed the App token, and gh reads GH_TOKEN. The operative
# grant is the GitHub App's installation permissions (Contents and Pull requests: Read & write),
# the same App sync-airtable.yml uses.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # The GitHub App secrets live on this environment, not at repository level.
    environment: staging

    env:
      SNAPSHOT_DIR: src/data/docs/rfcs
      SYNC_BRANCH: chore/rfc-sync
      BASE_BRANCH: staging

    steps:
      # Minted before the checkout so actions/checkout persists it as the git credential. A PR
      # opened with this token triggers pr-checks.yml; one opened with GITHUB_TOKEN would not.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}

      # ref is explicit: workflow_dispatch lets someone pick any ref, and the PR base is always
      # staging, so the branch has to be cut from staging or the diff would carry other commits.
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts: the sync needs tsx only, never a native build.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Sync RFC snapshots
        id: sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # The script writes nothing unless every fetch succeeds, so a failure here leaves the
          # checkout clean and opens no pull request.
          pnpm run sync:rfcs

          # Staged so that new and removed snapshots count: git diff ignores untracked files.
          git add -A -- "$SNAPSHOT_DIR"

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "RFC snapshots are unchanged — no branch, no commit, no pull request."
            echo "RFC snapshots unchanged. No pull request opened." >> "$GITHUB_STEP_SUMMARY"

            # A PR from an earlier run is now stale: upstream reverted, or staging caught up.
            # Left open, a reviewer could still merge content upstream no longer has.
            STALE_PR="$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" \
              --state open --json number --jq '.[0].number // empty')"
            if [ -n "$STALE_PR" ]; then
              gh pr close "$STALE_PR" --delete-branch \
                --comment 'Closed by the RFC sync: upstream now matches staging, so this change is no longer needed.'
              echo "Closed stale pull request #$STALE_PR." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Which RFCs changed, for the PR body. HEAD still holds the old snapshots.
          {
            echo 'stat<<STAT_EOF'
            git diff --cached --stat -- "$SNAPSHOT_DIR"
            echo 'STAT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push the sync branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # -B rebuilds the branch from the current staging every run, so it always carries
          # exactly one commit and can never develop a merge conflict.
          git checkout -B "$SYNC_BRANCH"
          git commit -m 'chore(docs): sync RFC snapshots'

          # If the open PR already carries these exact snapshots, keep it as it is. A fresh
          # commit would re-run pr-checks and dismiss approvals for no change. The fetch fails
          # harmlessly when the branch doesn't exist yet.
          if git fetch --quiet --depth=1 origin "$SYNC_BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD HEAD -- "$SNAPSHOT_DIR"; then
            echo "The open pull request already has these snapshots — not pushing."
            exit 0
          fi

          # --force, not --force-with-lease: a shallow checkout has no origin ref for the lease
          # to compare against. This workflow owns the branch and recreates it every run.
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open or update the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIFF_STAT: ${{ steps.sync.outputs.stat }}
        run: |
          set -euo pipefail

          BODY_FILE="$RUNNER_TEMP/pr-body.md"

          # Quoted heredocs keep backticks literal; printf injects the diff stat.
          {
            cat <<'EOF'
          ## Summary

          Automated refresh of the RFC pages under `/developers/rfcs/` from
          [interledger/rfcs](https://github.com/interledger/rfcs), opened by
          `.github/workflows/sync-rfcs.yml`. No human wrote this diff — it is the upstream
          markdown as `pnpm run sync:rfcs` fetched it.

          Changed snapshots:

          ```
          EOF
            printf '%s\n' "$DIFF_STAT"
            cat <<'EOF'
          ```

          ## Related Issue

          None — a schedule opens this pull request.

          ## Manual Test

          Reading the diff is the test: it is exactly what will appear on the site when this
          merges. To see it rendered, check out this branch, run `pnpm run start`, and open the
          changed pages under `/developers/rfcs/`.

          Worth a skim for:

          - an RFC rewritten wholesale or emptied upstream
          - new relative links to RFCs we don't publish (they point at GitHub instead)

          ## Checks

          - [x] `pnpm run sync:rfcs` — generated the updated snapshots

          ## PR Checklist

          - [x] PR title follows Conventional Commits
          - [x] Scope is focused — `src/data/docs/rfcs/` only
          - [ ] Linked issue included — N/A, scheduled automation

          ---

          This branch is rebuilt from `staging` and force-pushed on every run, so any commit
          pushed to it by hand will be discarded. To make a change, close this PR and open
          your own.
          EOF
          } > "$BODY_FILE"

          # '// empty' matters: without it gh prints "null" when no PR is open, and
          # `[ -n "null" ]` is true — so it would take the update path and `gh pr edit null`.
          PR_NUMBER="$(gh pr list \
            --head "$SYNC_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            # The force-push already moved the PR head; only the body is stale.
            gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"
            PR_URL="$(gh pr view "$PR_NUMBER" --json url --jq .url)"
            echo "Updated existing pull request: $PR_URL"
          else
            PR_URL="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title 'chore(docs): sync RFC snapshots' \
              --body-file "$BODY_FILE")"
            echo "Opened pull request: $PR_URL"
          fi

          echo "RFC snapshots changed: $PR_URL" >> "$GITHUB_STEP_SUMMARY"

  notify-slack:
    runs-on: ubuntu-latest
    needs: sync
    # A scheduled job that fails silently is a job that is not running. SLACK_BOT_TOKEN is a
    # repository secret, so this job needs no environment.
    if: ${{ failure() }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "frontend-team",
              "text": "❌ RFC sync failed in *${{ github.repository }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *RFC Sync Failed*\n*Repo:* ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
