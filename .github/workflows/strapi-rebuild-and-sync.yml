name: Strapi Rebuild & Sync
# Shared implementation behind every entry point that rebuilds and syncs a Strapi VM:
#   - scheduled-content-sync.yml — the daily run across staging and playground
#   - build-and-sync.yml         — a manual run against one selected branch
#
# This is a reusable workflow rather than a composite action because the VM jobs never check the
# repo out into the runner workspace — they operate on $DEPLOY_PATH, the long-lived checkout the
# systemd service runs from — and a local composite action is only resolvable after an
# actions/checkout. Keeping it a workflow also lets runs-on, environment, env and concurrency live
# here instead of being repeated by every caller.
#
# Not directly runnable: it has no schedule or dispatch trigger, only workflow_call.

on:
  workflow_call:
    inputs:
      branch:
        description: Deploy branch on the Strapi VM — staging or playground
        required: true
        type: string
      force_rebuild:
        description: Rebuild Strapi even when cms/ has not changed since the last run
        required: false
        default: false
        type: boolean
      notify_on_failure:
        description: Post to Slack if the rebuild or sync fails
        required: false
        default: true
        type: boolean

jobs:
  rebuild-and-sync:
    concurrency:
      # A manual dispatch racing the schedule (or two dispatches) must not overlap on the same
      # VM — both stop/rebuild/restart the same systemd service. The group is keyed on the branch
      # alone, not the calling workflow, so every entry point shares one queue per environment.
      group: strapi-rebuild-and-sync-${{ inputs.branch }}
      cancel-in-progress: false
    runs-on: strapi-vm
    environment: ${{ inputs.branch == 'playground' && 'strapi-playground' || 'strapi-staging' }}
    env:
      DEPLOY_PATH: ${{ vars.ENV_DEPLOY_PATH }}
      STRAPI_SERVICE_NAME: ${{ vars.ENV_STRAPI_SERVICE_NAME }}
      STRAPI_URL: ${{ vars.ENV_STRAPI_URL }}
      STRAPI_API_TOKEN: ${{ secrets.ENV_STRAPI_API_TOKEN }}
      SYNC_FORCE: ${{ vars.ENV_SYNC_FORCE }}
      DEPLOY_BRANCH: ${{ inputs.branch }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}

    steps:
      # The environment expression above maps anything that is not 'playground' onto
      # strapi-staging, so an unknown branch would otherwise run against the staging VM and only
      # fail later, at `git checkout`. Fail before touching the service instead.
      - name: Validate branch input
        shell: bash
        run: |
          set -euo pipefail

          case "${DEPLOY_BRANCH:-}" in
            staging | playground) ;;
            *)
              echo "Error: branch must be 'staging' or 'playground' (got '${DEPLOY_BRANCH:-}')."
              exit 1
              ;;
          esac

      - name: Rebuild Strapi (if needed) and sync content
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Error: ENV_DEPLOY_PATH is not set for this environment."
            exit 1
          fi

          if [ -z "${STRAPI_SERVICE_NAME:-}" ]; then
            echo "Error: ENV_STRAPI_SERVICE_NAME is not set for this environment."
            exit 1
          fi

          if [ -z "${STRAPI_URL:-}" ]; then
            echo "Error: ENV_STRAPI_URL is not set for this environment."
            exit 1
          fi

          if [ -z "${STRAPI_API_TOKEN:-}" ]; then
            echo "Error: ENV_STRAPI_API_TOKEN is not set for this environment."
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "Error: Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          source ~/.bashrc
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] || { echo "nvm not installed at $NVM_DIR"; exit 1; }
          . "$NVM_DIR/nvm.sh"
          nvm install --no-progress 24
          nvm use 24
          PNPM_VERSION=10.27.0
          corepack enable
          corepack prepare pnpm@$PNPM_VERSION --activate
          pnpm --version
          test "$(pnpm --version)" = "$PNPM_VERSION"

          # Add pnpm to PATH (not loaded from .bashrc in GitHub Actions)
          export PNPM_HOME="/home/strapi/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"

          cd "$DEPLOY_PATH"

          # ── Sync mutex ────────────────────────────────────────────────────────────────
          # Shared with Strapi's git sync (cms/src/utils/gitSync.ts, SYNC_LOCK_FILE). Both
          # writers run git against this checkout and both call `git rebase --abort` on
          # state they assume is their own, so without this each can abort the other's
          # in-progress rebase. Keep the path and the staleness window in step with that
          # file; the owner line is only ever read by a human, so its shape is per-side.
          #
          # The protocol, mirroring gitSync.ts:
          #   claim    write the owner line to a temp file, then `ln` it into place. `ln`
          #            is atomic and fails when the target exists, and the contents are
          #            already written, so the lock is never visible half-formed. An
          #            exclusive-create redirect would not do: a process killed between
          #            the create and the write leaves an empty lock behind.
          #   expire   on the file's mtime, never its contents, so even a truncated lock
          #            ages out instead of wedging the checkout.
          #   reclaim  `mv` the stale lock aside — mv fails once another contender has
          #            moved it, so exactly one of them wins.
          #   release  only after checking the contents are still ours.
          SYNC_LOCK="$DEPLOY_PATH/.git/strapi-sync.lock"
          SYNC_LOCK_STALE_MINUTES=10
          SYNC_LOCK_WAIT_SECONDS=30
          SYNC_LOCK_OWNER="pid=$$ host=$(hostname) run=${GITHUB_RUN_ID:-manual} at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          acquire_sync_lock() {
            local waited=0 tmp
            tmp="$SYNC_LOCK.$$.$RANDOM"
            while true; do
              printf '%s\n' "$SYNC_LOCK_OWNER" > "$tmp"
              if ln "$tmp" "$SYNC_LOCK" 2>/dev/null; then
                rm -f "$tmp"
                return 0
              fi
              rm -f "$tmp"

              # Reclaim a lock whose holder died, otherwise one killed process would block
              # every later run and every editor save permanently.
              #
              # `find` exits 0 whether or not it matched, so staleness has to be read from
              # its output — testing the exit status would report every lock as stale.
              if [ -n "$(find "$SYNC_LOCK" -maxdepth 0 -mmin "+$SYNC_LOCK_STALE_MINUTES" 2>/dev/null)" ]; then
                if mv "$SYNC_LOCK" "$SYNC_LOCK.stale.$$" 2>/dev/null; then
                  echo "::warning::Reclaimed a stale sync lock: $(cat "$SYNC_LOCK.stale.$$" 2>/dev/null || echo '<unreadable>')"
                  rm -f "$SYNC_LOCK.stale.$$"
                fi
              fi

              if [ "$waited" -ge "$SYNC_LOCK_WAIT_SECONDS" ]; then
                echo "Error: timed out after ${waited}s waiting for the sync lock at $SYNC_LOCK."
                echo "Held by: $(cat "$SYNC_LOCK" 2>/dev/null || echo '<unreadable>')"
                return 1
              fi
              sleep 1
              waited=$(( waited + 1 ))
            done
          }

          # Only while it is still ours: a lock we overran may have been reclaimed and
          # replaced, and removing it blindly would delete the new holder's.
          release_sync_lock() {
            if [ "$(cat "$SYNC_LOCK" 2>/dev/null || true)" = "$SYNC_LOCK_OWNER" ]; then
              rm -f "$SYNC_LOCK"
            fi
          }

          # Acquire first, then arm the trap. Arming it earlier would make a *failed*
          # acquisition delete the lock belonging to whichever writer already holds it.
          # The trap is a safety net for the `exit 1`s below; the happy path releases
          # explicitly as soon as the git work is done.
          acquire_sync_lock
          trap release_sync_lock EXIT

          # An operation interrupted by a conflict fails every later git command in this
          # checkout, including the integrate below, and used to need a hand to clear.
          # Strapi's git sync now clears its own (cms/src/utils/gitSync.ts), but a
          # hand-run command on the VM can still leave state behind. `--abort` restores
          # the pre-operation commit; `--quit` only clears the state, so it is the
          # fallback for a rebase too corrupt to unwind.
          if [ -d "$(git rev-parse --git-path rebase-merge)" ] || \
             [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "::warning::Checkout was left mid-rebase — clearing it."
            git rebase --abort || git rebase --quit || true
          fi
          if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
            echo "::warning::Checkout was left mid-merge — clearing it."
            git merge --abort || true
          fi
          if [ -f "$(git rev-parse --git-path CHERRY_PICK_HEAD)" ]; then
            echo "::warning::Checkout was left mid-cherry-pick — clearing it."
            git cherry-pick --abort || true
          fi

          # Captured before the integrate, so the rebuild trigger below sees everything it
          # brought in. A rebase can make OLD_SHA a non-ancestor of NEW_SHA; `git diff`
          # between two such commits still reports cms/ changes, and erring towards an
          # extra rebuild is the safe direction.
          OLD_SHA="$(git rev-parse HEAD)"

          git fetch origin "$DEPLOY_BRANCH"

          # Assert the branch rather than switching onto it unconditionally. A `git checkout`
          # against a tree Strapi is mid-write on can fail outright or carry local edits
          # across, so it is worth knowing when the checkout has drifted.
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$CURRENT_BRANCH" != "$DEPLOY_BRANCH" ]; then
            echo "::warning::Checkout was on '$CURRENT_BRANCH'; switching to '$DEPLOY_BRANCH'."
            git checkout "$DEPLOY_BRANCH"
          fi

          # Classified from the commit graph, never from `git merge --ff-only` failing: a
          # fast-forward also refuses when a dirty tracked file would be overwritten, and
          # sending that to the autostash rebase below leaves conflict markers in the
          # file and the editor's write stranded in the stash.
          if git merge-base --is-ancestor HEAD "origin/$DEPLOY_BRANCH"; then
            # Behind or level — the expected path and the cheapest one. Under `set -e` a
            # refusal fails the run with the working tree untouched.
            # `git merge --ff-only` rather than `git pull --ff-only` — no implicit second
            # fetch and no dependence on a configured upstream.
            if ! git merge --ff-only "origin/$DEPLOY_BRANCH"; then
              echo "Error: could not fast-forward $DEPLOY_PATH to origin/$DEPLOY_BRANCH."
              echo "Uncommitted changes Strapi wrote collide with incoming commits:"
              git status --short || true
              echo "Re-run once Strapi's git sync has committed them."
              exit 1
            fi
          elif git merge-base --is-ancestor "origin/$DEPLOY_BRANCH" HEAD; then
            # Ahead only: nothing to integrate. The push below sends the local commits.
            :
          else
            # Diverged: a Strapi commit never reached origin. Failing here used to take
            # down the whole run — rebuild and content sync alike — and it stayed failed
            # until someone intervened. Policy is that CMS content wins,
            # so replay the local commits on top of origin instead.
            #
            # `-X theirs` is the local side, not the upstream one: a rebase swaps ours/theirs,
            # so `ours` is origin and `theirs` is the commit being replayed. See git-rebase(1),
            # "Using merging strategies to rebase". Flipping it to `-X ours` would silently
            # discard the editor content this is trying to save.
            echo "::warning::$DEPLOY_PATH diverged from origin/$DEPLOY_BRANCH — replaying local commits on top (CMS wins)."
            git log --oneline "origin/$DEPLOY_BRANCH..HEAD" || true

            # autoStash covers tracked modifications only, so a page Strapi has written but
            # not yet staged is untracked and unprotected. That only matters when an
            # incoming commit adds the same path, where git refuses to detach HEAD with a
            # message ("could not detach HEAD") that says nothing about the cause.
            #
            # Checked rather than worked around: staging the file first does let the rebase
            # start, but the autostash pop then collides on the same path and leaves
            # conflict markers in src/content — a worse state than not starting, and
            # exactly what the unmerged guard below exists to prevent. Refusing early keeps
            # the checkout untouched.
            #
            # This is a snapshot, and deliberately so. Strapi stays up through the
            # integrate, and the sync mutex serialises git commands, not the MDX writes
            # that happen in the lifecycle hook before one. A save landing between this
            # check and the rebase can still stop it. That costs a failed run with a clear
            # message and an untouched checkout, which is the same outcome as catching it
            # here — so closing the window would mean stopping the CMS for the duration,
            # which is a far worse trade for a collision this rare.
            COLLIDING="$(comm -12 \
              <(git ls-files --others --exclude-standard | sort) \
              <(git diff --name-only --diff-filter=A "HEAD..origin/$DEPLOY_BRANCH" | sort))"
            if [ -n "$COLLIDING" ]; then
              echo "Error: $DEPLOY_BRANCH adds files that already exist untracked in $DEPLOY_PATH:"
              printf '%s\n' "$COLLIDING"
              echo "Strapi wrote these but has not committed them yet. Re-run once its sync has,"
              echo "or remove them if they are stale."
              exit 1
            fi

            # The tracked half of the same problem. autoStash lets the rebase run, but its
            # pop then conflicts on any dirty file the incoming commits also change: the
            # rebase still exits 0, and the file is left with conflict markers.
            DIRTY_OVERLAP="$(comm -12 \
              <(git diff --name-only HEAD | sort) \
              <(git diff --name-only "HEAD...origin/$DEPLOY_BRANCH" | sort))"
            if [ -n "$DIRTY_OVERLAP" ]; then
              echo "Error: $DEPLOY_BRANCH changes files with uncommitted edits in $DEPLOY_PATH:"
              printf '%s\n' "$DIRTY_OVERLAP"
              echo "Strapi wrote these but has not committed them yet. Re-run once its sync has."
              exit 1
            fi

            # --fork-point, as in gitSync.ts: after reset.yml force-pushes the branch,
            # plain merge-base semantics would replay the commits it discarded and the
            # push below would restore them.
            if ! git -c rebase.autoStash=true -c rerere.enabled=false \
                   rebase --fork-point -X theirs "origin/$DEPLOY_BRANCH"; then
              # Leaving it mid-rebase would break every later editor save as well as the next
              # run. What `-X theirs` cannot resolve is an existence conflict (a page deleted
              # on one side and edited on the other), which has no mechanically correct answer.
              git rebase --abort || true
              echo "Error: could not reconcile $DEPLOY_PATH with origin/$DEPLOY_BRANCH."
              echo "A modify/delete or rename conflict needs a human. Local commits:"
              git log --oneline "origin/$DEPLOY_BRANCH..HEAD" || true
              exit 1
            fi
          fi

          # Outside the divergence branch on purpose: the ahead-only case — a commit made
          # locally whose push failed — integrates nothing, and still has to be pushed.
          #
          # Non-fatal: the rebuild and sync below are still valid against this tree, and
          # the next run retries.
          if [ "$(git rev-list --count "origin/$DEPLOY_BRANCH..HEAD")" -gt 0 ]; then
            echo "Pushing $(git rev-list --count "origin/$DEPLOY_BRANCH..HEAD") local commit(s) to $DEPLOY_BRANCH."
            git push origin "HEAD:$DEPLOY_BRANCH" || \
              echo "::warning::Local commits not pushed; the next run will retry."
          fi

          # Defensive check: after a clean `-X theirs` rebase nothing can be unmerged, so
          # anything here came from the autostash pop — conflict markers sitting in the
          # working tree, which the next Strapi save would otherwise commit into src/content.
          if [ -n "$(git ls-files -u)" ]; then
            echo "Unresolved git conflicts in $DEPLOY_PATH:"
            git ls-files -u | awk '{ print $4 }' | sort -u
            echo "The working tree may contain conflict markers. Resolve by hand before the next run."
            exit 1
          fi

          NEW_SHA="$(git rev-parse HEAD)"

          # The git work is done, so the lock goes back now rather than at the end of the
          # step. Everything below is a rebuild (npm, systemd) and `sync:all`, which writes
          # into Strapi over HTTP with `x-skip-mdx-export` and touches no git state — none
          # of it needs serialising.
          #
          # Holding on through the rebuild was actively harmful: a full rebuild outlasts the
          # staleness window, so the lock expired while still held, an editor save reclaimed
          # it, and git ran concurrently anyway — the exact thing the lock exists to stop.
          release_sync_lock
          trap - EXIT

          # force_rebuild lets a caller rebuild with no new commits, so a run can recover from a
          # bad prior deploy without waiting for the next cms/ commit.
          if [ "${FORCE_REBUILD:-false}" = "true" ] || \
             [ -n "$(git diff --name-only "$OLD_SHA" "$NEW_SHA" -- cms/)" ]; then
            echo "Rebuilding Strapi."

            # Stop the service while we rebuild
            sudo systemctl stop "$STRAPI_SERVICE_NAME"

            # Nuclear option to ensure no old dependencies or build artifacts interfere with the new build after merging changes
            rm -rf cms/node_modules
            rm -rf cms/dist
            rm -rf node_modules
            pnpm install
            cd cms
            pnpm install

            cd "$DEPLOY_PATH"
            # Rebuild with more memory to avoid OOM errors during build
            NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

            cd "$DEPLOY_PATH/cms"
            NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

            cd "$DEPLOY_PATH"
            sudo systemctl start "$STRAPI_SERVICE_NAME"
            sleep 5
            sudo systemctl status "$STRAPI_SERVICE_NAME"
          else
            echo "No cms/ changes since the last run — skipping rebuild."
          fi

          echo "Syncing content, media, and navigation to Strapi..."
          cd "$DEPLOY_PATH/cms"

          if [ "${SYNC_FORCE:-false}" = "true" ]; then
            pnpm run sync:all --force
          else
            pnpm run sync:all
          fi

  notify-slack:
    runs-on: ubuntu-latest
    needs: rebuild-and-sync
    # A failed rebuild can leave the systemd service stopped, so this is worth flagging even for a
    # manually triggered run. Callers can opt out with notify_on_failure: false.
    # No always() wrapper: failure() already returns true when an ancestor job in a `needs` chain
    # fails, and that is the only case worth paging for — always() would add cancellations too.
    if: ${{ failure() && inputs.notify_on_failure }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "frontend-team",
              "text": "❌ Strapi rebuild/sync failed for *${{ inputs.branch }}* in *${{ github.repository }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Strapi Rebuild/Sync Failed*\n*Workflow:* ${{ github.workflow }}\n*Branch:* ${{ inputs.branch }}\n*Repo:* ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
