name: Scheduled Strapi Rebuild & Content Sync
on:
  schedule:
    - cron: '0 6 * * *' # 08:00 SAST
  workflow_dispatch: # manual on-demand run — always rebuilds, then syncs

jobs:
  rebuild-and-sync:
    strategy:
      fail-fast: false
      matrix:
        branch: [staging, playground]
    uses: ./.github/workflows/strapi-rebuild-and-sync.yml
    with:
      branch: ${{ matrix.branch }}
      # Always rebuild, regardless of whether /cms changed since the last run, on both the
      # daily schedule and a manual trigger — this replaces the old conditional that skipped
      # scheduled rebuilds when nothing in /cms had changed.
      force_rebuild: true
    # ENV_STRAPI_API_TOKEN resolves from the called job's environment; inherit covers the
    # repo-level secrets the Slack notification needs.
    secrets: inherit
