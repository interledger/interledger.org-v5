name: Scheduled Content Sync
# Runs the daily content/navigation/media sync for both staging and playground, replacing the
# old per-commit sync in merge.yml. Resyncing rewrites component IDs on every entry it touches,
# which invalidates any editor's open admin session — running it once a day instead of on every
# push means that only happens once a day instead of on every push.
# GitHub Actions schedules run in UTC; South Africa Standard Time has no daylight saving, so
# 08:00 SAST is always 06:00 UTC.
on:
  schedule:
    - cron: '0 6 * * *' # 08:00 SAST
  workflow_dispatch: # manual run for testing the schedule itself

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        branch: [staging, playground]
    runs-on: ubuntu-latest
    environment: ${{ matrix.branch == 'playground' && 'strapi-playground' || 'strapi-staging' }}
    env:
      STRAPI_URL: ${{ vars.ENV_STRAPI_URL }}
      STRAPI_API_TOKEN: ${{ secrets.ENV_STRAPI_API_TOKEN }}
      SYNC_FORCE: ${{ vars.ENV_SYNC_FORCE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Sync content, media, and navigation to Strapi
        working-directory: cms
        run: |
          set -euo pipefail

          if [ -z "${STRAPI_URL:-}" ]; then
            echo "Error: ENV_STRAPI_URL is not set for this environment."
            exit 1
          fi

          if [ -z "${STRAPI_API_TOKEN:-}" ]; then
            echo "Error: ENV_STRAPI_API_TOKEN is not set for this environment."
            exit 1
          fi

          if [ "${SYNC_FORCE:-false}" = "true" ]; then
            pnpm run sync:all --force
          else
            pnpm run sync:all
          fi

  notify-slack:
    runs-on: ubuntu-latest
    needs: sync
    if: ${{ always() && failure() }}
    steps:
      - name: Notify Slack on failure
        uses: slackapi/slack-github-action@v2.1.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "frontend-team",
              "text": "❌ Scheduled content sync failed in *${{ github.repository }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Scheduled Content Sync Failed*\n*Repo:* ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
