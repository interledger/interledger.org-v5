name: Scheduled Strapi Rebuild & Content Sync
on:
  schedule:
    - cron: '0 6 * * *' # 08:00 SAST
  workflow_dispatch: # manual on-demand run — always rebuilds, then syncs

jobs:
  rebuild-and-sync:
    strategy:
      fail-fast: false
      matrix:
        branch: [staging, playground]
    uses: ./.github/workflows/strapi-rebuild-and-sync.yml
    with:
      branch: ${{ matrix.branch }}
      # This will either run on manual trigger or on schedule. Either way, we want to rebuild if /cms changed
      # since the last run, so we don't skip a rebuild on a manual trigger.
      force_rebuild: true
    # ENV_STRAPI_API_TOKEN resolves from the called job's environment; inherit covers the
    # repo-level secrets the Slack notification needs.
    secrets: inherit
