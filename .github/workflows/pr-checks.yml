name: PR Checks

on:
  pull_request:
      branches:
        - staging
        - playground

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # The two suites are split into separate jobs so they fail independently and
  # report separately: a cms serializer break shouldn't hide the state of the
  # Astro site's tests, or vice versa. They also run in parallel.
  #
  # --ignore-scripts on both installs: the unit tests don't touch sharp,
  # better-sqlite3, or @parcel/watcher, so skipping their native builds keeps
  # these jobs fast. esbuild resolves its platform binary from the optional dep
  # without its postinstall, so vitest still runs.
  test-src:
    name: Test src
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # setup-node resolves the lockfile with a non-recursive readdir of the
          # workspace root, so both test jobs would otherwise key their cache on
          # the root lockfile — identical keys, colliding entries, and no
          # invalidation when cms/pnpm-lock.yaml changes. Name it per job.
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      # continue-on-error so a missing report never masks the test failure that
      # caused it — vitest skips writing coverage when tests fail.
      - name: Report coverage
        if: always()
        continue-on-error: true
        run: node scripts/coverage-report.mjs src

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-src
          path: coverage/
          retention-days: 14

  test-cms:
    name: Test cms
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cms

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # cms installs from its own lockfile — see the note in test-src.
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Report coverage
        if: always()
        continue-on-error: true
        run: node ../scripts/coverage-report.mjs cms

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # path is workspace-relative — defaults.run.working-directory
          # applies to `run` steps only, not to `uses`.
          name: coverage-cms
          path: cms/coverage/
          retention-days: 14

  build-and-dryrun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Content-addressed, so an unchanged image set is an exact key hit and the
      # post-job save is skipped entirely. The previous key used github.run_id,
      # which can never match, so every run restored via the prefix fallback and
      # then wrote another ~148 MB entry — filling the 10 GB repo cache and
      # evicting the very entries it depended on.
      - name: Cache optimized images
        uses: ./.github/actions/cache-optimized-images

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          cd cms
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Start ephemeral Strapi from this branch
        working-directory: cms
        env:
          # Throwaway secrets for a disposable, single-run instance — never
          # shared with any real Strapi deployment, so fixed values are fine.
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          DATABASE_FILENAME: .tmp/ci-dry-run.db
          HOST: 0.0.0.0
          PORT: 1337
          CI_API_TOKEN_OUTPUT_PATH: ${{ github.workspace }}/cms/.ci-api-token
        run: |
          rm -f "$DATABASE_FILENAME" "$CI_API_TOKEN_OUTPUT_PATH"
          nohup pnpm run start > strapi-ci.log 2>&1 &
          echo $! > strapi.pid

      - name: Wait for Strapi to become healthy
        working-directory: cms
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1337/_health >/dev/null; then
              echo "Strapi is up."
              exit 0
            fi
            sleep 2
          done
          echo "Strapi did not become healthy in time. Logs:"
          cat strapi-ci.log
          exit 1

      - name: Run MDX sync in dry-run mode
        working-directory: cms
        env:
          STRAPI_URL: http://localhost:1337
        run: |
          if [ ! -s .ci-api-token ]; then
            echo "Error: .ci-api-token was not written by the Strapi bootstrap step."
            exit 1
          fi
          export STRAPI_API_TOKEN=$(cat .ci-api-token)
          echo "Running MDX sync in dry-run mode against an ephemeral Strapi built from this branch."
          echo "Note: since this Strapi instance starts empty (aside from bootstrap-seeded media),"
          echo "every content entry below will report as 'would create', not 'would update' — that's expected."
          pnpm run sync:mdx:dry-run

      - name: Stop ephemeral Strapi
        if: always()
        working-directory: cms
        run: |
          if [ -f strapi.pid ]; then
            kill "$(cat strapi.pid)" 2>/dev/null || true
          fi
