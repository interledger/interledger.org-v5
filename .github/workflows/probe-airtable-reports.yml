name: Probe Airtable Reports (INTORG-1305)
# Temporary. Do not merge. Delete the branch after the probe runs.
# A push to the probe branch starts it. workflow_dispatch works only from the
# default branch, so it cannot start this file.

on:
  push:
    branches: [ravi/intorg-1305-airtable-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe report tables
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          REPORT_DUMP: ${{ runner.temp }}/submissions.csv
        run: node scripts/probe-airtable-reports.mjs
      # The data is private and this repo is public. Encrypt it for Ravi's key
      # only (AES key wrapped with RSA), and never upload the plain file.
      - name: Encrypt the submission dump
        run: |
          cd "$RUNNER_TEMP"
          cat > ravi.pem <<'KEY'
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAvIvHgmAJEyyl3UAkcVx9
            cNQKGSGEqU7f+yNjbkPuoaTxtwxae0vGFUH/tZ4RUCXAEDvV7LRUmFpckAUHxfky
            Rj91Wzk7Yl9RbJM94u8UNZ4VLrGS0K6y+vi8p1eBVd1mwYY9hEyEfIvrbrdalT2Z
            s97cwjHxZ/5jCY2ij3U8nBsZJFzfCXs0YIwDfbwLfRB99VRmmH2Z4VR3FfO+lnK1
            cWKvFjV+uO/yAz37tybD9+q8yFiQ1m6ziASFlQxCs9t8GVZxMXxK81C9ZSQQzwor
            WtAzGoEnCF9XYjHCV55njlTsXCdp2xRrqfONBhZAlx1sjjgKy9a9jv9ssEgifPBQ
            wdp3/YXgxg2lfuQBZR9FAf5KZwNalNHc6VHFlCphzJWCgXFgKVGLKRMmDtUA1ZNj
            z7nNZDNlX6za76fxQzvzvstYuhASIJnExvkFa0a2JYp6WUe5xHpJlqc+LP4wHsN9
            tWQgDmLyRAqyT9GK9jJSG9Nz3euMYF+zYed7PvjWVbu9WCAubLDpfAq9WMFiDele
            uZiMgtizzoYK5Amz1MG0dYTaaQ32gqy1mt3sa4PsZ1nlYDZOJ1Ji3IFuuMMAD1xj
            Bt3fHsFMdli1OZt5dcRhJ7t0ENTpOo1Ibe6ifobme4P7QDUITSLFuIIxpAz4Xy9O
            2cx5KY17nFv8TCh3a9oV2LsCAwEAAQ==
            -----END PUBLIC KEY-----
          KEY
          sed -i "s/^ *//" ravi.pem
          openssl rand -out aes.key 32
          tar -cf data.tar submissions.csv projects.csv projects-schema.json grantees.csv
          openssl enc -aes-256-cbc -pbkdf2 -salt -in data.tar -out data.tar.enc -pass file:aes.key
          openssl pkeyutl -encrypt -pubin -inkey ravi.pem -pkeyopt rsa_padding_mode:oaep -in aes.key -out aes.key.enc
          shred -u data.tar submissions.csv projects.csv projects-schema.json grantees.csv aes.key
          mkdir dump && mv data.tar.enc aes.key.enc dump/
      - uses: actions/upload-artifact@v4
        with:
          name: submissions-encrypted
          path: ${{ runner.temp }}/dump
          retention-days: 1

  # Runs the real sync from staging on the runner. Nothing is committed or
  # pushed. The sync writes public fields only. Ayesha's image test reports stay
  # Draft, so the Live filter is patched here (never in the repo) to also take
  # Draft reports whose Public Summary starts with "TEST".
  dry-run-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Also read Draft TEST reports
        run: |
          node -e '
            const fs = require("fs");
            const file = "src/utils/main/airtableReports.ts";
            const live = "return raw.fields[PUBLICATION_STATUS_FIELD_ID] === LIVE_STATUS";
            const src = fs.readFileSync(file, "utf8");
            if (!src.includes(live)) { console.error("Live check not found"); process.exit(1); }
            const test = " || String(raw.fields[\"fld28HOMQQ4a1jiiP\"] ?? \"\").trimStart().startsWith(\"TEST\")";
            fs.writeFileSync(file, src.replace(live, live + test));
            // The PUBLIC view returns only Live records, so read the table without it.
            const script = "scripts/import-airtable.ts";
            const viewParams = "new URLSearchParams({ view: REPORTS_VIEW_ID })";
            const scriptSrc = fs.readFileSync(script, "utf8");
            if (!scriptSrc.includes(viewParams)) { console.error("Report view params not found"); process.exit(1); }
            fs.writeFileSync(script, scriptSrc.replace(viewParams, "new URLSearchParams()"));
          '
          grep -n 'startsWith("TEST")' src/utils/main/airtableReports.ts
          grep -n 'const params = new URLSearchParams()' scripts/import-airtable.ts
      - name: Run the sync
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: |
          pnpm run sync:airtable
          echo "--- counts"
          for f in grantee-data grant-reports grantee-profiles; do
            echo "$f: $(jq length src/data/airtable/$f.json)"
          done
          echo "--- report images: alt set, alt empty"
          jq '[.[].images[] | select(.alt != "")] | length' src/data/airtable/grant-reports.json
          jq '[.[].images[] | select(.alt == "")] | length' src/data/airtable/grant-reports.json
          echo "--- grantId: reports, with a record ID, found in grantee-data.json"
          jq -n --slurpfile r src/data/airtable/grant-reports.json --slurpfile d src/data/airtable/grantee-data.json \
            '($d[0] | map(.id)) as $ids | [($r[0] | length), ($r[0] | map(select(.grantId | test("^rec"))) | length), ($r[0] | map(select(.grantId as $g | $ids | index($g))) | length)] | map(tostring) | join(" / ")'
          echo "--- stored report image files (format, size, bytes, EXIF, GPS)"
          node -e '
            const sharp = require("sharp"); const fs = require("fs"); const path = require("path");
            const dir = "public/img/grantee-reports";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir, { recursive: true }).filter((f) => f.endsWith(".webp")) : [];
            if (files.length === 0) console.log("none");
            (async () => { for (const f of files) {
              const p = path.join(dir, f); const m = await sharp(p).metadata();
              console.log(`${m.format} ${m.width}x${m.height} ${fs.statSync(p).size} bytes, exif: ${Boolean(m.exif)}, icc: ${Boolean(m.icc)}`);
            } })();
          '
          echo "--- prettier"
          pnpm exec prettier --check src/data/airtable/*.json
