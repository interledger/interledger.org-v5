name: Probe Airtable Reports (INTORG-1305)
# Temporary. Do not merge. Delete the branch after the probe runs.
# A push to the probe branch starts it. workflow_dispatch works only from the
# default branch, so it cannot start this file.

on:
  push:
    branches: [ravi/intorg-1305-airtable-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe report tables
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: node scripts/probe-airtable-reports.mjs

  # Runs the INTORG-1423 parser on the real rows. Counts only.
  legacy-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: ravi/intorg-1423
          path: site
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: site
      - name: Parse legacy rows
        working-directory: site
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: |
          cp ../probe/scripts/probe-legacy-parser.ts ./probe-legacy-parser.ts
          pnpm exec tsx probe-legacy-parser.ts

  # Runs the real sync from staging on the runner. Nothing is committed or
  # pushed. The sync writes public fields only. Ayesha's image test reports stay
  # Draft, so the Live filter is patched here (never in the repo) to also take
  # Draft reports whose Public Summary starts with "TEST".
  dry-run-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Also read Draft TEST reports
        run: |
          node -e '
            const fs = require("fs");
            const file = "src/utils/main/airtableReports.ts";
            const live = "return raw.fields[PUBLICATION_STATUS_FIELD_ID] === LIVE_STATUS";
            const src = fs.readFileSync(file, "utf8");
            if (!src.includes(live)) { console.error("Live check not found"); process.exit(1); }
            const test = " || String(raw.fields[\"fld28HOMQQ4a1jiiP\"] ?? \"\").trimStart().startsWith(\"TEST\")";
            fs.writeFileSync(file, src.replace(live, live + test));
            // The PUBLIC view returns only Live records, so read the table without it.
            const script = "scripts/import-airtable.ts";
            const viewParams = "new URLSearchParams({ view: REPORTS_VIEW_ID })";
            const scriptSrc = fs.readFileSync(script, "utf8");
            if (!scriptSrc.includes(viewParams)) { console.error("Report view params not found"); process.exit(1); }
            fs.writeFileSync(script, scriptSrc.replace(viewParams, "new URLSearchParams()"));
          '
          grep -n 'startsWith("TEST")' src/utils/main/airtableReports.ts
          grep -n 'const params = new URLSearchParams()' scripts/import-airtable.ts
      - name: Run the sync
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: |
          pnpm run sync:airtable
          echo "--- counts"
          for f in grantee-data grant-reports grantee-profiles; do
            echo "$f: $(jq length src/data/airtable/$f.json)"
          done
          echo "--- report images: alt set, alt empty"
          jq '[.[].images[] | select(.alt != "")] | length' src/data/airtable/grant-reports.json
          jq '[.[].images[] | select(.alt == "")] | length' src/data/airtable/grant-reports.json
          echo "--- grantId: reports, with a record ID, found in grantee-data.json"
          jq -n --slurpfile r src/data/airtable/grant-reports.json --slurpfile d src/data/airtable/grantee-data.json \
            '($d[0] | map(.id)) as $ids | [($r[0] | length), ($r[0] | map(select(.grantId | test("^rec"))) | length), ($r[0] | map(select(.grantId as $g | $ids | index($g))) | length)] | map(tostring) | join(" / ")'
          echo "--- stored report image files (format, size, bytes, EXIF, GPS)"
          node -e '
            const sharp = require("sharp"); const fs = require("fs"); const path = require("path");
            const dir = "public/img/grantee-reports";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir, { recursive: true }).filter((f) => f.endsWith(".webp")) : [];
            if (files.length === 0) console.log("none");
            (async () => { for (const f of files) {
              const p = path.join(dir, f); const m = await sharp(p).metadata();
              console.log(`${m.format} ${m.width}x${m.height} ${fs.statSync(p).size} bytes, exif: ${Boolean(m.exif)}, icc: ${Boolean(m.icc)}`);
            } })();
          '
          echo "--- prettier"
          pnpm exec prettier --check src/data/airtable/*.json

  # INTORG-1314: the real sync with the uncommitted grant period change applied
  # on the runner (never pushed to the site branch). Nothing is committed.
  # Counts only.
  grant-period:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          ref: ravi/intorg-1314
          path: site
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git apply ../probe/patches/intorg-1314-grant-period.patch
        working-directory: site
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: site
      - name: Run the sync and count grant periods
        working-directory: site
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: |
          # The log can name records, so print the exit code and the field-level lines only.
          set +e
          pnpm run sync:airtable > ../sync.log 2>&1
          code=$?
          set -e
          echo "sync exit: $code"
          grep -E "^(ℹ️|⚠️)" ../sync.log | grep -v "http" || true
          if [ "$code" -ne 0 ]; then echo "sync failed, $(wc -l < ../sync.log) log lines withheld"; exit 1; fi
          echo "--- grant periods"
          cp ../probe/scripts/probe-grant-period.test.ts src/probe-grant-period.test.ts
          pnpm exec vitest run src/probe-grant-period.test.ts --silent=false --reporter=verbose 2>&1 | grep -vE "^\s*$" 
          echo "--- prettier"
          pnpm exec prettier --check src/data/airtable/grantee-data.json
          echo "--- grantee-data.json lines changed (added, removed)"
          git diff --numstat -- src/data/airtable/grantee-data.json

  # Why the directory view returns 2 published grants (was 267). Counts and
  # field metadata only.
  published-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Count records by publish status
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: node scripts/probe-published-filter.mjs

  # The PUBLIC views Jeremiah named (PRO-371 fd7a8291). Counts and field names only.
  new-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare the new views with the current ones
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: node scripts/probe-new-views.mjs

  # ravi/airtable-public-view: the sync on the new Projects view, compared with
  # staging's grantee-data.json. Counts only.
  public-view-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ravi/airtable-public-view
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cp src/data/airtable/grantee-data.json /tmp/before.json
      - name: Run the sync
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: pnpm run sync:airtable 2>&1 | grep -E "ℹ️|⚠️|Error|records" || true
      - name: Compare with staging, counts only
        run: |
          A=src/data/airtable/grantee-data.json
          echo "before: $(jq length /tmp/before.json), after: $(jq length $A)"
          echo "ids only before: $(jq -n --slurpfile a /tmp/before.json --slurpfile b $A '[$a[0][].id] - [$b[0][].id] | length')"
          echo "ids only after: $(jq -n --slurpfile a /tmp/before.json --slurpfile b $A '[$b[0][].id] - [$a[0][].id] | length')"
          echo "records that differ: $(jq -n --slurpfile a /tmp/before.json --slurpfile b $A '[$a[0][] as $x | $b[0][] | select(.id == $x.id and . != $x)] | length')"
          echo "field keys after: $(jq -c '[.[] | (.fields // .) | keys[]] | unique' $A)"

  # ravi/intorg-1423 with the public Submitted Reports view. Counts only.
  legacy-view-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ravi/intorg-1423
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the sync
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: pnpm run sync:airtable 2>&1 | grep -vE "https?://" | grep -E "ℹ️|⚠️|Error|skipped|rec[A-Za-z0-9]{14}" || true
      - name: Counts only
        run: |
          L=src/data/airtable/legacy-grant-reports.json
          echo "legacy reports: $(jq length $L)"
          echo "grants with a link: $(jq '[.[].grantId] | unique | length' $L)"
          echo "links per grant: $(jq -c 'group_by(.grantId) | map(length) | group_by(.) | map({(.[0]|tostring): length}) | add' $L)"
          echo "by type: $(jq -c 'group_by(.reportType) | map({(.[0].reportType): length}) | add' $L)"
          echo "grantee-data: $(jq length src/data/airtable/grantee-data.json)"
          npx prettier --check $L

  # Grants whose Project Links has a URL but Submitted Reports has no row. Counts only.
  links-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ravi/intorg-1423
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the sync
        env:
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
        run: pnpm run sync:airtable > /dev/null 2>&1
      - name: Compare, counts only
        run: |
          node -e '
            const g = require("./src/data/airtable/grantee-data.json");
            const l = require("./src/data/airtable/legacy-grant-reports.json");
            const legacy = new Map();
            for (const r of l) legacy.set(r.grantId, (legacy.get(r.grantId) ?? 0) + 1);
            const urls = (f) => (String(f["Project Links"] ?? "").match(/https?:\/\/[^\s,;]+/g) ?? []).length;
            let both = 0, linksOnly = 0, legacyOnly = 0, none = 0, moreLinks = 0;
            for (const rec of g) {
              const u = urls(rec.fields ?? rec), n = legacy.get(rec.id) ?? 0;
              if (u && n) { both++; if (u > n) moreLinks++ }
              else if (u) linksOnly++;
              else if (n) legacyOnly++;
              else none++;
            }
            console.log({ grants: g.length, both, linksOnly, legacyOnly, none, moreLinksThanLegacyRows: moreLinks });
          '
