[build]
  command = "pnpm install && pnpm run build"
  base = "/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "./netlify/plugins/cache-images"

# Purge the roadmap CDN cache tag after each deploy. Durable Cache survives
# deploys, so without this a code/CSS-only change to /developers/roadmap keeps
# serving stale HTML until the cache expires. See README "CDN caching".
[[plugins]]
  package = "./netlify/plugins/purge-roadmap"

# Redirect old singular summit routes to plural (EN and ES)
[[redirects]]
  from = "/summit/:year/talk/:slug"
  to = "/summit/:year/talks/:slug"
  status = 301

[[redirects]]
  from = "/summit/:year/speaker/:slug"
  to = "/summit/:year/speakers/:slug"
  status = 301

[[redirects]]
  from = "/es/summit/:year/talk/:slug"
  to = "/es/summit/:year/talks/:slug"
  status = 301

[[redirects]]
  from = "/es/summit/:year/speaker/:slug"
  to = "/es/summit/:year/speakers/:slug"
  status = 301

[dev]
  command = "pnpm install && pnpm run build"
  base = "/"
  publish = "dist"

# Production branch (main)
[context.production]
  command = "pnpm install && pnpm run build"

# Staging branch deploy
[context.staging]
  command = "pnpm install && pnpm run build"

# Deploy previews (for PRs against staging)
[context.deploy-preview]
  command = "pnpm install && pnpm run build"

# Ordering matters. When several [[headers]] rules match one request Netlify
# merges them, and for a header set more than once the LAST matching rule wins.
# This catch-all must therefore come FIRST, so the specific rules below can
# override its Cache-Control. With it last, every asset rule below was silently
# discarded and everything was served `max-age=0, must-revalidate` — verified on
# the deploy, where /img/*, /fonts/* and /documents/* all ignored their own
# rules. X-Robots-Tag is unaffected either way: no other rule sets it, so it
# merges rather than conflicts.
#
# This also decides browser caching for Netlify Image CDN responses, which
# inherit their Cache-Control from the source asset — without it, transformed
# images revalidate on every navigation despite a ~1 year edge TTL.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/developers/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/blog/preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/page-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/preview/page-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/preview/hackathon-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/developers/blog/preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
