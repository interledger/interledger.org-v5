[build]
  command = "pnpm install && pnpm run build"
  base = "/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "./netlify/plugins/cache-images"

# Purge the roadmap CDN cache tag after each deploy. Durable Cache survives
# deploys, so without this a code/CSS-only change to /developers/roadmap keeps
# serving stale HTML until the cache expires. See README "CDN caching".
[[plugins]]
  package = "./netlify/plugins/purge-roadmap"

# This plugin adds a noindex header to staging builds, branch-deploy builds,
# and preview builds. It does not add the header to production builds. This
# file cannot set a header for only one deploy context. So the plugin adds
# the header to dist/_headers after the build. See the headers block for
# path "/*" below.
[[plugins]]
  package = "./netlify/plugins/robots-header"

# Redirect old singular summit routes to plural (EN and ES)
[[redirects]]
  from = "/summit/:year/talk/:slug"
  to = "/summit/:year/talks/:slug"
  status = 301

[[redirects]]
  from = "/summit/:year/speaker/:slug"
  to = "/summit/:year/speakers/:slug"
  status = 301

[[redirects]]
  from = "/es/summit/:year/talk/:slug"
  to = "/es/summit/:year/talks/:slug"
  status = 301

[[redirects]]
  from = "/es/summit/:year/speaker/:slug"
  to = "/es/summit/:year/speakers/:slug"
  status = 301

[dev]
  command = "pnpm install && pnpm run build"
  base = "/"
  publish = "dist"

# Production branch (main)
[context.production]
  command = "pnpm install && pnpm run build"

# Staging branch deploy
[context.staging]
  command = "pnpm install && pnpm run build"

# Deploy previews (for PRs against staging)
[context.deploy-preview]
  command = "pnpm install && pnpm run build"

# The order of these rules is important. When a request matches more than
# one [[headers]] rule, Netlify merges the rules. If more than one rule sets
# the same header, the LAST matching rule wins. For this reason, this
# catch-all rule must come FIRST. Then the specific rules below can override
# its Cache-Control value. In the past, this rule was last in the file. As a
# result, Netlify silently ignored every asset rule below it. All requests
# got the header `max-age=0, must-revalidate`. This error occurred on the
# live deploy. The paths /img/*, /fonts/*, and /documents/* all ignored
# their own rules.
#
# This rule also sets the browser cache behavior for Netlify Image CDN
# responses. These responses inherit their Cache-Control value from the
# source asset. Without this rule, a transformed image revalidates on every
# page visit, even though its edge cache lasts about one year.
#
# This rule does not set X-Robots-Tag. This omission is intentional. The
# rules in this file apply to every deploy context. Production must stay
# indexable. For non-production contexts, the robots-header build plugin
# adds X-Robots-Tag: noindex, nofollow to dist/_headers. See the [[plugins]]
# entry above.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/developers/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/blog/preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/page-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/preview/page-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/preview/hackathon-preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/developers/blog/preview"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
