<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img">
  <title>Economía informal y economía sumergida</title>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="300" y="52" text-anchor="middle" fill="#5c2d91" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Economía informal</text>
  <text x="800" y="52" text-anchor="middle" fill="#3d45b5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Economía sumergida</text>
  <ellipse cx="360" cy="360" rx="310" ry="230" fill="#f4e9f8" stroke="#c9a6dc" stroke-width="2"/>
  <ellipse cx="740" cy="360" rx="310" ry="230" fill="#e7e9fb" stroke="#b7b9ee" stroke-width="2"/>
  <path d="M550 160c70 48 112 118 112 200s-42 152-112 200c-70-48-112-118-112-200s42-152 112-200z" fill="#e4d4f2"/>
  <rect x="478" y="168" width="144" height="32" rx="16" fill="#5c2d91"/>
  <text x="550" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SUPERPOSICIÓN</text>
  <text x="230" y="250" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="230" dy="0">Trabajo legítimo al margen</tspan>
    <tspan x="230" dy="24">de la protección formal</tspan>
  </text>
  <text x="230" y="340" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="230" dy="0">A menudo sin cobertura plena</tspan>
    <tspan x="230" dy="24">de la protección social</tspan>
  </text>
  <text x="230" y="450" text-anchor="middle" fill="#5c2d91" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">~2000 millones</text>
  <text x="230" y="484" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="230" dy="0">de trabajadores en unidades</tspan>
    <tspan x="230" dy="24">económicas informales</tspan>
  </text>
  <text x="550" y="250" text-anchor="middle" fill="#5c2d91" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Actividad no declarada</text>
  <text x="550" y="310" text-anchor="middle" fill="#5c2d91" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <tspan x="550" dy="0">Difícil de observar</tspan>
    <tspan x="550" dy="24">y medir</tspan>
  </text>
  <text x="550" y="400" text-anchor="middle" fill="#5c2d91" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <tspan x="550" dy="0">Solo parcialmente visible</tspan>
    <tspan x="550" dy="24">para las autoridades</tspan>
    <tspan x="550" dy="24">públicas</tspan>
  </text>
  <text x="880" y="250" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="880" dy="0">Actividad ocultada</tspan>
    <tspan x="880" dy="24">deliberadamente</tspan>
  </text>
  <text x="880" y="340" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="880" dy="0">Principalmente un problema</tspan>
    <tspan x="880" dy="24">fiscal: reduce los ingresos</tspan>
    <tspan x="880" dy="24">tributarios y de la</tspan>
    <tspan x="880" dy="24">seguridad social</tspan>
  </text>
  <text x="880" y="480" text-anchor="middle" fill="#1f1f1f" font-family="Arial, Helvetica, sans-serif" font-size="18">
    <tspan x="880" dy="0">Puede incluir</tspan>
    <tspan x="880" dy="24">actividades ilícitas</tspan>
  </text>
</svg>
